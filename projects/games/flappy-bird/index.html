<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flappy Bird — getsmart demo</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #0d1b2a;
    display: grid; place-items: center;
    font-family: system-ui, sans-serif;
    color: #e0e1dd;
  }
  .wrap { text-align: center; }
  canvas {
    background: linear-gradient(#4ec0ca 0%, #4ec0ca 75%, #ded895 75%, #ded895 100%);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    touch-action: manipulation;
  }
  p { opacity: .7; font-size: 14px; margin-top: 12px; }
  kbd {
    background:#1b263b; border:1px solid #415a77; border-radius:4px;
    padding:1px 6px; font-size:12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="360" height="540"></canvas>
    <p>Press <kbd>Space</kbd> / click / tap to flap</p>
  </div>

<script>
// --- Setup ----------------------------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const FLOOR = H * 0.75;

// --- Tunable constants ----------------------------------------------------
const GRAVITY = 0.25;   // floaty mode
const FLAP = -6;        // softer flap to match the lighter gravity
const PIPE_GAP = 140;     // vertical opening between pipes
const PIPE_W = 56;
const PIPE_SPACING = 200; // horizontal distance between pipes
const SPEED = 2.2;

// --- Game state -----------------------------------------------------------
let bird, pipes, score, best = 0, state; // state: "ready" | "play" | "over"

function reset() {
  bird = { x: 90, y: H / 2, vy: 0, r: 12 };
  pipes = [];
  score = 0;
  state = "ready";
  spawnPipe(W + 80);
  spawnPipe(W + 80 + PIPE_SPACING);
}

function spawnPipe(x) {
  const minTop = 50;
  const maxTop = FLOOR - PIPE_GAP - 50;
  const top = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x, top, passed: false });
}

// --- Input ----------------------------------------------------------------
function flap() {
  if (state === "ready") state = "play";
  if (state === "over") { reset(); return; }
  bird.vy = FLAP;
}
addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); flap(); }
});
canvas.addEventListener("mousedown", flap);
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); flap(); }, { passive: false });

// --- Update ---------------------------------------------------------------
function update() {
  if (state !== "play") return;

  bird.vy += GRAVITY;
  bird.y += bird.vy;

  // ceiling / floor
  if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
  if (bird.y + bird.r > FLOOR) { bird.y = FLOOR - bird.r; gameOver(); }

  for (const p of pipes) {
    p.x -= SPEED;

    // score when the bird clears a pipe
    if (!p.passed && p.x + PIPE_W < bird.x) {
      p.passed = true;
      score++;
      best = Math.max(best, score);
    }

    // collision: bird overlaps the pipe column AND is outside the gap
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
    const inGap = bird.y - bird.r > p.top && bird.y + bird.r < p.top + PIPE_GAP;
    if (inX && !inGap) gameOver();
  }

  // recycle pipes
  if (pipes.length && pipes[0].x + PIPE_W < 0) pipes.shift();
  const last = pipes[pipes.length - 1];
  if (last && last.x < W - PIPE_SPACING) spawnPipe(last.x + PIPE_SPACING);
}

function gameOver() { state = "over"; }

// --- Render ---------------------------------------------------------------
function draw() {
  ctx.clearRect(0, 0, W, H);

  // pipes
  ctx.fillStyle = "#5cb85c";
  ctx.strokeStyle = "#3d8b3d";
  ctx.lineWidth = 3;
  for (const p of pipes) {
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.strokeRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_W, FLOOR - (p.top + PIPE_GAP));
    ctx.strokeRect(p.x, p.top + PIPE_GAP, PIPE_W, FLOOR - (p.top + PIPE_GAP));
  }

  // ground line
  ctx.fillStyle = "#c2b280";
  ctx.fillRect(0, FLOOR, W, 4);

  // bird
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(Math.max(-0.5, Math.min(1, bird.vy / 12)));
  ctx.fillStyle = "#ffd54a";
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fff"; // eye
  ctx.beginPath(); ctx.arc(5, -4, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(6, -4, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ff8c42"; // beak
  ctx.fillRect(bird.r - 2, -3, 7, 6);
  ctx.restore();

  // score
  ctx.fillStyle = "#fff";
  ctx.font = "bold 40px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(score, W / 2, 70);

  // overlays
  ctx.font = "bold 22px system-ui, sans-serif";
  if (state === "ready") {
    ctx.fillText("Tap to start", W / 2, H / 2 - 40);
  } else if (state === "over") {
    ctx.fillText("Game Over", W / 2, H / 2 - 50);
    ctx.font = "16px system-ui, sans-serif";
    ctx.fillText(`Score ${score}   ·   Best ${best}`, W / 2, H / 2 - 22);
    ctx.fillText("Tap to retry", W / 2, H / 2 + 4);
  }
}

// --- Loop -----------------------------------------------------------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
