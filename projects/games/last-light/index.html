<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050607">
<title>Last Light</title>
<style>
  :root{--fg:rgba(255,255,255,.86);--dim:rgba(255,255,255,.45);--line:rgba(255,255,255,.55)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:#050607;overflow:hidden;overscroll-behavior:none;touch-action:none;
    font:11px/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--fg);letter-spacing:.08em}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:auto;touch-action:none}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%)}
  .hud{position:fixed;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.8);transition:opacity .3s}
  body.photo #tl,body.photo #bars,body.photo #compass,body.photo #tr,body.photo #thr,body.photo #prompt{opacity:0!important}
  #tl{top:calc(10px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left))}
  #tr{top:calc(10px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));text-align:right}
  #lights{font-size:15px;letter-spacing:.35em}
  #bars{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:96px}
  .bar{margin:5px 0}.bar i{display:block;height:2px;background:rgba(255,255,255,.18);margin-top:3px}
  .bar b{display:block;height:2px;background:var(--fg);width:100%}
  #compass{left:50%;transform:translateX(-50%);top:calc(46px + env(safe-area-inset-top));width:290px;height:33px}
  #toast{left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));text-align:center;font-size:12px;
    opacity:0;transition:opacity .6s;max-width:80vw}
  #prompt{left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;opacity:0;transition:opacity .25s}
  #prompt .pb{width:140px;height:2px;background:rgba(255,255,255,.2);margin:6px auto 0}
  #prompt .pb b{display:block;height:2px;width:0;background:var(--fg)}
  #btns{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:grid;
    grid-template-columns:repeat(2,58px);gap:10px;z-index:5}
  .b{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--fg);
    font:inherit;font-size:10px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;text-align:center;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:0;touch-action:none}
  .b.on{background:rgba(255,255,255,.85);color:#000}
  .b.act{width:74px;height:74px;grid-column:span 2;justify-self:end;font-size:11px}
  .b.hide{display:none}
  #stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid var(--line);border-radius:50%;
    pointer-events:none;opacity:0;transition:opacity .2s}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.35);
    border:1px solid var(--line)}
  #thr{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(120px + env(safe-area-inset-bottom));width:2px;height:70px;background:rgba(255,255,255,.2);pointer-events:none}
  #thr b{position:absolute;left:-4px;width:10px;height:2px;background:var(--fg);bottom:0}
  #title{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.6s}
  #title h1{margin:0;font-weight:200;font-size:34px;letter-spacing:.7em;padding-left:.7em}
  #title p{margin:10px 0 0;color:var(--dim);letter-spacing:.3em}
  #over{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;text-align:center;z-index:20}
  #over h2{font-weight:200;font-size:20px;letter-spacing:.32em;margin:0 12px 12px;padding-left:.32em}
  #over p{margin:6px 0;color:var(--dim)}
  #boot{position:fixed;inset:0;background:#050607;display:flex;align-items:center;justify-content:center;z-index:30;transition:opacity 1s}
  #err{position:fixed;left:10px;right:10px;top:50%;color:#fff;z-index:40;display:none;font-size:11px;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="ui"></div>
<div id="stick"><div id="knob"></div></div>
<div id="thr" class="hud"><b id="thrv"></b></div>
<div id="tl" class="hud"><div id="lights"></div><div id="nights" style="margin-top:4px;color:var(--dim)"></div></div>
<canvas id="compass" class="hud" width="600" height="68"></canvas>
<div id="tr" class="hud"><div id="clock"></div><div id="wx" style="color:var(--dim)"></div><div id="baro" style="color:var(--dim)"></div></div>
<div id="bars" class="hud">
  <div class="bar">HULL<i><b id="bHull"></b></i></div>
  <div class="bar">FUEL<i><b id="bFuel"></b></i></div>
  <div class="bar">WARM<i><b id="bWarm"></b></i></div>
  <div class="bar" id="cans">CANS</div>
</div>
<div id="toast" class="hud"></div>
<div id="prompt" class="hud"><div id="promptT"></div><div class="pb"><b id="promptB"></b></div></div>
<div id="title"><h1>LAST LIGHT</h1><p>KEEP THE LAMPS BURNING</p></div>
<div id="btns">
  <button class="b act hide" id="bAct">ACT</button>
  <button class="b" id="bSail">SAIL<br>0</button>
  <button class="b" id="bView">VIEW</button>
  <button class="b" id="bPhoto">PHOTO</button>
  <button class="b" id="bSnd">SND</button>
  <button class="b hide" id="bUp">UP</button>
  <button class="b hide" id="bDn">DOWN</button>
  <button class="b hide" id="bFast">FAST</button>
</div>
<div id="over"><div><h2 id="overT">LIGHTS OUT</h2><p id="overS"></p><p style="margin-top:22px">TAP TO TRY AGAIN</p></div></div>
<div id="boot">LAST LIGHT</div>
<div id="err"></div>
<div id="fps" class="hud" style="left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message||e) + '\n'; });
const $ = id => document.getElementById(id);
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const Q = new URLSearchParams(location.search);

/* ───────────────────────── noise (CPU) ───────────────────────── */
function h2(x, y) { let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
function vn(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h2(ix, iy), h2(ix + 1, iy), ux), lerp(h2(ix, iy + 1), h2(ix + 1, iy + 1), ux), uy); }
function fbm2(x, y) { let s = 0, a = .5; for (let i = 0; i < 4; i++) { s += a * vn(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 9.2; a *= .5; } return s / .9375; }

/* ───────────────────────── renderer ───────────────────────── */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', alpha: false });
const DPR = window.devicePixelRatio || 1;
const maxRatio = Math.min(DPR, 2);
let ratio = Q.get('q') === 'hi' ? maxRatio : Math.min(maxRatio, 1.5);
if (Q.get('r')) ratio = parseFloat(Q.get('r'));
const fixedRatio = Q.get('q') === 'hi' || !!Q.get('r');
renderer.setPixelRatio(ratio);
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x808890, 0.0003);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.4, 9000);
scene.add(camera);
function onResize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); U.uPxScale.value = innerHeight * renderer.getPixelRatio() * 0.5; }
addEventListener('resize', onResize);

/* ───────────────────────── shared uniforms ───────────────────────── */
const U = {
  uTime: { value: 0 }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uMoonDir: { value: new THREE.Vector3(0, -1, 0) },
  uZen: { value: new THREE.Vector3(.27, .3, .33) }, uHor: { value: new THREE.Vector3(.5, .53, .55) }, uSunCol: { value: new THREE.Vector3(1, .92, .8) },
  uSunAmt: { value: 0 }, uMoonAmt: { value: 0 }, uFlash: { value: 0 }, uFogCol: { value: new THREE.Vector3(.5, .53, .55) },
  uFogAmt: { value: 0 }, uFogDen: { value: 0.0003 }, uCover: { value: .9 }, uStars: { value: 0 }, uLight: { value: .5 },
  uWind: { value: new THREE.Vector2(1, 0) }, uRain: { value: 0 }, uSea: { value: .3 }, uPxScale: { value: 400 }
};

/* ───────────────────────── waves (shared by CPU + GPU) ───────────────────────── */
const WL = [140, 82, 47, 27, 14, 7.5], WDIR = [0, -.35, .5, -.7, .9, -1.25], WCAP = [2.0, 1.3, .7, .38, .2, .1];
const WIND_ANG = 0.55;
const waves = WL.map((L, i) => { const k = TAU / L; return { k, w: Math.sqrt(9.81 * k), phi: i * 1.7 + .3, dx: Math.cos(WIND_ANG + WDIR[i]), dz: Math.sin(WIND_ANG + WDIR[i]), A: 0, Q: 0 }; });
const uWA = [], uWB = [];
for (let i = 0; i < 6; i++) { uWA.push(new THREE.Vector4()); uWB.push(new THREE.Vector4()); }
let simT = 0, ampSum = 1;
function updateWaves(s) {
  ampSum = 0;
  waves.forEach((w, i) => {
    w.A = WCAP[i] * (0.10 + 0.90 * Math.pow(s, 0.8 + 0.25 * i));
    w.Q = Math.min(1, 0.8 / (6 * w.k * w.A + 1e-4)) * (0.3 + 0.7 * s);
    ampSum += w.A;
    uWA[i].set(w.dx, w.dz, w.k, w.A); uWB[i].set(w.w, w.Q, w.phi, 0);
  });
}
// height of the sea surface at world (x,z): invert the horizontal Gerstner displacement in 2 passes
const _o = { h: 0, J: 1, sx: 0, sz: 0 };
function sea(x, z, T) {
  let bx = x, bz = z;
  for (let it = 0; it < 2; it++) {
    let dx = 0, dz = 0;
    for (let i = 0; i < 6; i++) { const w = waves[i], c = Math.cos(w.k * (w.dx * bx + w.dz * bz) - w.w * T + w.phi) * w.Q * w.A; dx += w.dx * c; dz += w.dz * c; }
    bx = x - dx; bz = z - dz;
  }
  let h = 0, sy = 0, sx = 0, sz = 0;
  for (let i = 0; i < 6; i++) { const w = waves[i], th = w.k * (w.dx * bx + w.dz * bz) - w.w * T + w.phi, s = Math.sin(th), c = Math.cos(th);
    h += w.A * s; sy += w.Q * w.k * w.A * s; sx += w.dx * w.k * w.A * c; sz += w.dz * w.k * w.A * c; }
  _o.h = h; _o.J = 1 - sy; _o.sx = sx; _o.sz = sz; return _o;
}
const seaH = (x, z) => sea(x, z, simT).h;

/* ───────────────────────── GLSL chunks ───────────────────────── */
const GLSL_COMMON = `
uniform float uTime; uniform vec3 uSunDir, uMoonDir, uZen, uHor, uSunCol, uFogCol; uniform float uSunAmt, uMoonAmt, uFlash, uFogAmt, uFogDen, uCover, uStars, uLight, uRain, uSea;
uniform vec2 uWind;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }
float fbm3(vec2 p){ float s=0.,a=.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s/.875; }
vec3 skyBase(vec3 d){
  float h=clamp(d.y,0.,1.);
  vec3 c=mix(uHor,uZen,pow(h,0.45));
  float s=max(dot(d,uSunDir),0.);
  c+=uSunCol*(pow(s,6.)*.18+pow(s,80.)*.45)*uSunAmt;
  float m=max(dot(d,uMoonDir),0.);
  c+=vec3(.5,.6,.8)*(pow(m,14.)*.22+pow(m,200.)*.5)*uMoonAmt;
  c+=vec3(.62,.68,.9)*uFlash*.5;
  return c;
}`;

const SKY_VS = `varying vec3 vDir; void main(){ vDir=position; vec4 p=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*p; gl_Position.z=gl_Position.w*.99999; }`;
const SKY_FS = GLSL_COMMON + `
varying vec3 vDir;
void main(){
  vec3 d=normalize(vDir);
  vec3 c=skyBase(d);
  vec2 cp=d.xz/(d.y+.14)*1.1+uWind*uTime*.012;
  float n=fbm(cp*.8), n2=fbm(cp*2.4+vec2(0.,uTime*.01));
  float dens=smoothstep(1.-uCover-.28,1.-uCover+.22,n*.85+n2*.3);
  vec3 cl=uHor*1.05, cd=uHor*.42+uZen*.25;
  vec3 cc=mix(cl,cd,smoothstep(.32,.78,n2)*.85);
  cc+=uSunCol*uSunAmt*.2*pow(max(dot(d,uSunDir),0.),5.)*(1.-dens*.4);
  cc+=vec3(.6,.66,.85)*uFlash*(.35+n2);
  float fade=smoothstep(0.,.16,d.y);
  float a=dens*(.35+.65*fade);
  // stars + moon behind cloud
  vec3 back=vec3(0.);
  if(uStars>.01 && d.y>0.){ vec2 sp=d.xz/(d.y+.5)*70.; vec2 id=floor(sp); float r=hash21(id); vec2 f=fract(sp)-.5;
    float st=step(.9935,r)*smoothstep(.22,0.,length(f-(vec2(hash21(id+7.),hash21(id+3.))-.5)*.5)); back+=vec3(.8,.85,1.)*st*uStars*(.6+.4*sin(uTime*3.+r*40.)); }
  float md=dot(d,uMoonDir); back+=vec3(.85,.9,1.)*smoothstep(.99935,.9997,md)*uMoonAmt*2.2*(.93+.07*vnoise(d.xz*180.))+vec3(.5,.6,.85)*smoothstep(.992,.9997,md)*uMoonAmt*.12;
  c=c+back*(1.-a);
  c=mix(c,cc,a);
  c=mix(c,uFogCol,1.-smoothstep(0.,.2+.8*uFogAmt,d.y));
  c+=(hash21(gl_FragCoord.xy+fract(uTime))-.5)*.008; gl_FragColor=vec4(c,1.);
}`;

const WATER_VS = `
uniform vec4 uWA[6]; uniform vec4 uWB[6]; uniform vec2 uCenter; uniform float uTime;
varying vec3 vWorld; varying vec2 vBase; varying float vDist;
void main(){
  vec2 b=uCenter+position.xz; vBase=b;
  float d=length(position.xz); vDist=d;
  vec3 p=vec3(b.x,0.,b.y);
  for(int i=0;i<6;i++){
    vec4 A=uWA[i], B=uWB[i];
    float L=6.28318/A.z; float fa=1.-smoothstep(L*5.,L*14.,d);
    float th=A.z*(A.x*b.x+A.y*b.y)-B.x*uTime+B.z;
    p.xz+=B.y*A.w*A.xy*cos(th)*fa; p.y+=A.w*sin(th)*fa;
  }
  vWorld=p;
  gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);
}`;
const WATER_FS = GLSL_COMMON + `
uniform vec4 uWA[6]; uniform vec4 uWB[6]; uniform vec3 uCam; uniform float uUnder, uAmpSum; uniform vec4 uLamp[7]; uniform float uBoatLamp; uniform vec4 uBoat;
uniform vec3 uWaterFog;
varying vec3 vWorld; varying vec2 vBase; varying float vDist;
void main(){
  vec3 V=normalize(uCam-vWorld);
  float d=distance(uCam,vWorld);
  float sx=0.,sz=0.,sy=0.,h=0.;
  for(int i=0;i<6;i++){
    vec4 A=uWA[i], B=uWB[i];
    float L=6.28318/A.z; float fa=1.-smoothstep(L*25.,L*70.,vDist);
    float th=A.z*(A.x*vBase.x+A.y*vBase.y)-B.x*uTime+B.z;
    float s=sin(th), c=cos(th);
    sx+=A.x*A.z*A.w*c*fa; sz+=A.y*A.z*A.w*c*fa; sy+=B.y*A.z*A.w*s*fa; h+=A.w*s*fa;
  }
  float J=1.-sy;
  vec3 N=normalize(vec3(-sx,1.-sy*.6,-sz));
  // fine chop
  float dn=1.-smoothstep(25.,230.,vDist);
  vec2 q=vBase*.9+uWind*uTime*.35; float e=.35;
  float n0=vnoise(q*1.7), n1=vnoise(q*1.7+vec2(e,0.)), n2=vnoise(q*1.7+vec2(0.,e));
  vec2 q2=vBase*3.1-uWind*uTime*.6; float m0=vnoise(q2), m1=vnoise(q2+vec2(e,0.)), m2=vnoise(q2+vec2(0.,e));
  N.xz+=((vec2(n1-n0,n2-n0)/e)*.10+(vec2(m1-m0,m2-m0)/e)*.05)*(.35+uSea*.9)*dn;
  vec2 q3=mat2(.8,-.6,.6,.8)*vBase*.37+uWind*uTime*.12; float o0=vnoise(q3), o1=vnoise(q3+vec2(e,0.)), o2=vnoise(q3+vec2(0.,e));
  N.xz+=(vec2(o1-o0,o2-o0)/e)*.11*(.4+uSea)*(1.-smoothstep(60.,700.,vDist));
  // rain dimples
  if(uRain>.02){ vec2 rp=vBase*1.4; vec2 id=floor(rp); vec2 fr=fract(rp)-.5; float rnd=hash21(id); float tt=fract(uTime*1.4+rnd);
    vec2 off=(vec2(hash21(id+3.),hash21(id+8.))-.5)*.5; vec2 dd=fr-off; float rad=length(dd);
    float ring=smoothstep(.07,0.,abs(rad-tt*.45))*(1.-tt)*step(rnd,uRain*.9);
    N.xz+=normalize(dd+1e-4)*ring*.22*(1.-smoothstep(25.,90.,vDist)); }
  N=normalize(N);

  float fogF=max(1.-exp(-d*d*uFogDen*uFogDen),(1.-exp(-d*uFogDen*.5))*.75);
  float lum=uLight;
  if(!gl_FrontFacing){
    // seen from below: refracted sky window + dark water
    vec3 up=-V; float cosI=clamp(up.y,0.,1.); float sinT=sqrt(1.-cosI*cosI)*1.33;
    vec3 col=uWaterFog;
    if(sinT<1.){ float cosT=sqrt(1.-sinT*sinT); vec3 rd=normalize(vec3(up.x*.75,cosT,up.z*.75)); col=mix(col,skyBase(rd)*1.15+col*.5,smoothstep(1.,.78,sinT)); }
    float rip=.85+.3*vnoise(vBase*.7+uTime*.4);
    col*=rip; col=mix(col,uWaterFog,1.-exp(-d*.04));
    gl_FragColor=vec4(col,1.); return;
  }
  float ndv=max(dot(N,V),0.);
  float F=.02+.98*pow(1.-ndv,5.);
  F=clamp(F,0.,1.); F=mix(F,max(F,.14),uSea*.6);
  vec3 R=reflect(-V,N); R.y=max(R.y,.012);
  float cn=vnoise(R.xz/(R.y+.25)*1.6+uWind*uTime*.01);
  vec3 refl=skyBase(R)*(.86+.28*cn);
  // sun patches where cloud breaks
  float brk=1.-uCover;
  float spatch=smoothstep(.55,.78,vnoise(vBase*.0022+uWind*uTime*.012))*brk*uSunAmt;
  float hn=h/max(uAmpSum,.1);
  vec3 deep=vec3(.03,.052,.058), shal=vec3(.085,.12,.115);
  vec3 body=mix(deep,shal,clamp(hn*.55+.45,0.,1.)*.65+(1.-N.y)*2.5);
  body*=(lum*.95+uFlash*.7+spatch*1.6);
  body+=vec3(.004,.007,.008);
  body+=uHor*vec3(.8,1.,.97)*(.14+.14*clamp(hn*.5+.5,0.,1.))*(.55+.45*N.y)*(1.+spatch*2.);
  vec3 col=body*(1.-F)+refl*F;
  col+=vec3(1.,.93,.8)*pow(max(dot(R,uSunDir),0.),260.)*uSunAmt*(.4+brk*3.)*F*4.;
  col+=vec3(.6,.72,1.)*pow(max(dot(R,uMoonDir),0.),110.)*uMoonAmt*2.2;
  // lamps (lighthouses, boat)
  for(int i=0;i<7;i++){ vec4 L=uLamp[i]; if(L.z>.01){ vec3 lp=vec3(L.x,L.w,L.y); vec3 Lv=lp-vWorld; float dl=length(Lv); Lv/=dl;
      float g=pow(max(dot(R,Lv),0.),300.)*L.z*11./(1.+dl*.004);
      float glow=L.z*.16/(1.+pow(dl/70.,2.));
      col+=vec3(1.,.62,.28)*(g*F*(1.+.8*vnoise(vBase*4.+uTime)) + glow*(1.-lum)*.35*(.4+.6*N.y)); } }

      let x = sc.x + ox, z = sc.z + oz, y = sc.y + f.dy + Math.sin(t * .8 + i) * .4; const dx = x - bx, dz = z - bz, dd = Math.hypot(dx, dz); if (dd < 10) { x += dx / (dd || 1) * (10 - dd) * .9; z += dz / (dd || 1) * (10 - dd) * .9; }
      _d.position.set(x, y, z); _d.rotation.set(0, Math.atan2(-Math.sin(f.a), Math.cos(f.a)) + (1), 0); _d.lookAt(x - Math.sin(f.a) * f.r, y, z + Math.cos(f.a) * f.r); _d.scale.set(1, 1, 1); _d.updateMatrix(); fish.setMatrixAt(i, _d.matrix); }
    fish.instanceMatrix.needsUpdate = true; }
  // spray upload
  sprayGeo.attributes.position.needsUpdate = true; sprayGeo.attributes.aLife.needsUpdate = true; sprayGeo.attributes.aSize.needsUpdate = true;
  // bolt fades
  updateHUD(dt); updateAudio(dt);
  G.cpu = lerp(G.cpu || 0, performance.now() - now0, .05);
  if (Q.get('fps') && frameN % 20 === 0) { const f = $('fps'); f.style.display = 'block'; f.textContent = Math.round(1 / avgDt) + ' fps · ' + ratio.toFixed(2) + 'x · cpu ' + G.cpu.toFixed(1) + 'ms'; }
  // quality scaler
  if (!fixedRatio && frameN > 30) { scalerT += dt; if (scalerT > 1.2) { scalerT = 0; if (avgDt > .026 && ratio > .55) { ratio = Math.max(.55, ratio * .86); renderer.setPixelRatio(ratio); onResize(); } else if (avgDt < .0145 && ratio < maxRatio) { upT++; if (upT > 3) { upT = 0; ratio = Math.min(maxRatio, ratio * 1.1); renderer.setPixelRatio(ratio); onResize(); } } else upT = 0; } }
  renderer.render(scene, camera);
}

/* ───────────────────────── boot ───────────────────────── */
function boot() {
  initLights(); spawnBoat(); updateWaves(W.sea); onResize();
  const skip = Q.get('skip');
  ['bAct', 'bSail', 'bView', 'bPhoto', 'bSnd'].forEach(i => $(i).style.visibility = skip ? 'visible' : 'hidden'); if (!skip) $('btns').style.opacity = 0;
  if (skip) { G.mode = 'play'; G.t = 99; G.blend = 1; cam.yaw = boat.yaw; setLamp(LIGHTS[0], false); LIGHTS[0].fuel = 0; LIGHTS[0].failed = true; }
  else { G.t = 0; cam.yaw = boat.yaw; }
  // settle boat on the water
  boat.y = seaH(boat.x, boat.z);
  setTimeout(() => { $('boot').style.opacity = 0; setTimeout(() => $('boot').remove(), 1100); }, 400);
  requestAnimationFrame(render);
  document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
}
// dev hook for screenshots / tuning
window.LL = { G, W, boat, cam, LIGHTS, ISLES, U, harbour, camera, scene, renderer, strike, wxTarget, distress, setWx(p) { const q = PRESETS.find(x => x.n === p); Object.assign(wxTarget, q); Object.assign(W, q); W.name = q.n; W.sea = clamp(.12 + q.wind * .88, 0, 1); wxT = -99999; },
  shot(o) { if (o.tod !== undefined) G.tod = o.tod; if (o.wx) this.setWx(o.wx); if (o.mode === 'photo' && !G.photo) { G.mode = 'play'; G.t = 99; togglePhoto(); } if (o.cam) Object.assign(cam.free, o.cam); if (o.boat) Object.assign(boat, o.boat); if (o.lights !== undefined) LIGHTS.forEach((L, i) => { setLamp(L, !!(o.lights >> i & 1)); L.fuel = L.lit ? .9 : 0; }); G.blend = 1; } };
boot();
