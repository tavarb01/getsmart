<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test Opt-Out Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; }
    label { display: block; margin: .75rem 0; }
    input { width: 100%; padding: .4rem; }
    #result { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Fake People Search — Opt Out</h1>
  <p>Local fixture for testing the harness. No network, no real site.</p>
  <form id="form">
    <label>Full name <input id="name"></label>
    <label>Email <input id="email"></label>
    <label>Profile URL <input id="url"></label>
    <button id="submit" type="submit">Submit removal request</button>
  </form>
  <p id="result"></p>
  <script>
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('result').textContent = 'Request received.';
    });
  </script>
</body>
</html>
